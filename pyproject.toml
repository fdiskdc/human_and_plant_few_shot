[project]
name = "human-and-plant-few-shot"
version = "1.0.0"
description = "RGCNFormer RNA modification classification - training, inference, and analysis"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tqdm",
    "prettytable",
    "h5py",
    "tensorboard",
]

[dependency-groups]
dev = [
    "pytest",
]
analysis = [
    "matplotlib",
    "networkx",
    "pandas",
    "plotly",
    "scipy",
    "seaborn",
    "umap-learn",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow",
    "gpu",
    "integration",
    "unit",
    "smoke",
]
norecursedirs = [".git", ".omc", ".omo", "npy", "logs*", "output", "cache", "fig", "att_fig", "motif_logo*", "visualization/notebooks"]
