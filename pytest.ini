[pytest]
# pytest 配置 / pytest configuration
# RGCNFormer (mRModN) 项目测试套件
# RGCNFormer (mRModN) project test suite

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出格式 / Output format
addopts =
    -v
    --tb=short
    --strict-markers

# 标记定义 / Marker definitions
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests requiring GPU (deselect with '-m "not gpu"')
    integration: integration tests
    unit: unit tests
    smoke: minimal smoke tests for CI

# 忽略的目录 / Ignored directories
norecursedirs = .git .omc .omo npy logs* output cache fig att_fig motif_logo* visualization/notebooks
